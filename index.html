<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeamToGrader — Найкращий апгрейдер по Team Fortress 2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&family=Teko:wght@600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        siteBg: '#121214', panelBg: '#181b22', panelBorder: '#272b36',
                        accentGold: '#f3ba2f', accentOrange: '#e67e22', textGray: '#9ba1a6'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #121214; color: #f3f4f6; font-family: 'Montserrat', sans-serif; user-select: none; }
        .cyber-font { font-family: 'Teko', sans-serif; letter-spacing: 0.05em; text-transform: uppercase; }
        .cyber-panel { background: #181b22; border: 1px solid #272b36; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .cyber-btn { background: linear-gradient(135deg, #f3ba2f 0%, #d49a15 100%); color: #121214; font-weight: 800; font-family: 'Montserrat', sans-serif; transition: all 0.2s; box-shadow: 0 4px 15px rgba(243, 186, 47, 0.3); cursor: pointer; }
        .cyber-btn:hover { background: linear-gradient(135deg, #ffd15c 0%, #e0a418 100%); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(243, 186, 47, 0.5); }
        .cyber-btn:active { transform: translateY(1px); }
        .item-card { background: #1e222b; border: 1px solid #2c323f; transition: all 0.2s; position: relative; overflow: hidden; cursor: pointer; }
        .item-card:hover { border-color: #f3ba2f; transform: translateY(-2px); }
        .item-card.selected { border-color: #f3ba2f !important; background: rgba(243, 186, 47, 0.08); }
        .tab-btn { background: #1c2029; border: 1px solid #2e3544; color: #9ba1a6; transition: all 0.2s; cursor: pointer; }
        .tab-btn.active { background: #f3ba2f; color: #121214; font-weight: 800; border-color: #f3ba2f; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #2e3544; border-radius: 3px; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- NAVBAR -->
    <header class="cyber-panel border-b border-panelBorder px-6 py-3.5 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-lg bg-gradient-to-tr from-amber-500 to-yellow-400 flex items-center justify-center text-black text-xl font-black shadow-lg">
                    <i class="fa-solid fa-bolt"></i>
                </div>
                <div>
                    <h1 class="cyber-font text-3xl text-accentGold leading-none">TeamToGrader</h1>
                    <p class="text-[9px] text-textGray tracking-widest font-bold uppercase">Найкращий апгрейдер по Team Fortress 2</p>
                </div>
            </div>

            <!-- TABS -->
            <div class="flex gap-2 bg-black/40 p-1 rounded-xl border border-panelBorder">
                <button onclick="switchTab('upgrader')" id="tab-btn-upgrader" class="tab-btn active px-6 py-2 rounded-lg font-bold text-xs uppercase">⚡ Апгрейдер</button>
                <button onclick="switchTab('cases')" id="tab-btn-cases" class="tab-btn px-6 py-2 rounded-lg font-bold text-xs uppercase">🎁 Кейси</button>
                <button onclick="switchTab('inventory')" id="tab-btn-inventory" class="tab-btn px-6 py-2 rounded-lg font-bold text-xs uppercase">🎒 Інвентар</button>
            </div>

            <!-- BALANCE & ADMIN -->
            <div class="flex items-center gap-4 bg-black/40 px-4 py-2 rounded-xl border border-panelBorder">
                <div>
                    <span class="text-[9px] text-textGray block font-bold">БАЛАНС</span>
                    <span id="balCoins" class="cyber-font text-2xl text-accentGold">100 ТК</span>
                </div>
                <button onclick="requestAdmin()" class="w-9 h-9 rounded-lg bg-panelBorder flex items-center justify-center text-textGray hover:text-accentGold transition" title="Адмін-панель">
                    <i class="fa-solid fa-shield-halved"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="max-w-7xl w-full mx-auto p-6 flex-1">

        <!-- TAB 1: UPGRADER -->
        <div id="section-upgrader" class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
            <!-- Left: Inventory -->
            <div class="lg:col-span-3 cyber-panel p-4 rounded-2xl h-[600px] flex flex-col">
                <h2 class="text-xs font-bold uppercase tracking-wider text-textGray mb-3 border-b border-panelBorder pb-2 flex items-center gap-2">
                    <i class="fa-solid fa-warehouse text-accentGold"></i> Твій інвентар
                </h2>
                <div class="mb-3 flex justify-between items-center bg-black/30 p-2.5 rounded-xl border border-panelBorder">
                    <span class="text-xs text-textGray font-bold">Ставка (ТК):</span>
                    <input id="directRef" type="number" min="0" value="0" oninput="calcOdds()" class="w-24 bg-panelBg border border-panelBorder text-right px-2.5 py-1 rounded-lg text-accentGold font-bold text-sm focus:outline-none focus:border-amber-500">
                </div>
                <div id="invGrid" class="flex-1 overflow-y-auto grid grid-cols-2 gap-2 pr-1 content-start"></div>
                <div class="mt-3 pt-3 border-t border-panelBorder text-center bg-black/30 p-2.5 rounded-xl">
                    <span class="text-[10px] text-textGray font-bold block">СУМА СТАВКИ</span>
                    <div id="totalBet" class="cyber-font text-3xl text-accentGold">0 ТК</div>
                </div>
            </div>

            <!-- Center: Wheel Machine -->
            <div class="lg:col-span-6 cyber-panel p-6 rounded-2xl h-[600px] flex flex-col items-center justify-between relative overflow-hidden">
                <div class="text-center z-10 w-full">
                    <span id="targetBadge" class="text-[10px] bg-black/50 text-textGray px-3 py-1 rounded-full border border-panelBorder font-bold uppercase tracking-wider">Оберіть ціль праворуч</span>
                    <h2 id="targetName" class="cyber-font text-4xl text-white mt-1">---</h2>
                </div>

                <div class="relative flex items-center justify-center my-auto">
                    <canvas id="wheelCanvas" width="280" height="280" class="rounded-full shadow-2xl"></canvas>
                    <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none text-center">
                        <span id="chanceLabel" class="text-[10px] text-textGray uppercase font-bold tracking-widest">Шанс</span>
                        <span id="chanceText" class="cyber-font text-6xl text-accentGold font-bold">0.00%</span>
                    </div>
                </div>

                <!-- Result Overlay -->
                <div id="resultOverlay" class="hidden absolute inset-0 bg-[#121214]/95 backdrop-blur-md flex flex-col items-center justify-center z-30 p-6 text-center">
                    <h3 id="resTitle" class="cyber-font text-6xl mb-2">УСПІХ!</h3>
                    <div id="resItemBox" class="mb-6 p-4 rounded-xl border border-panelBorder bg-panelBg"></div>
                    <button onclick="closeResult()" class="cyber-btn px-8 py-3 rounded-xl text-sm uppercase">Продовжити</button>
                </div>

                <button id="upgradeBtn" onclick="startUpgrade()" disabled class="cyber-btn w-full py-4 rounded-xl cyber-font text-3xl uppercase opacity-40 cursor-not-allowed">
                    ПОКРАЩИТИ
                </button>
            </div>

            <!-- Right: Target Catalog -->
            <div class="lg:col-span-3 cyber-panel p-4 rounded-2xl h-[600px] flex flex-col">
                <h2 class="text-xs font-bold uppercase tracking-wider text-textGray mb-3 border-b border-panelBorder pb-2 flex items-center gap-2">
                    <i class="fa-solid fa-crosshairs text-accentGold"></i> Цілі апгрейду
                </h2>
                <div id="catalogGrid" class="flex-1 overflow-y-auto space-y-2 pr-1"></div>
            </div>
        </div>

        <!-- TAB 2: CASES -->
        <div id="section-cases" class="hidden grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
            <!-- Bomzh -->
            <div class="cyber-panel p-5 rounded-2xl text-center flex flex-col justify-between items-center h-[430px] border-panelBorder">
                <img src="https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZLQHTxDZ7I56KU0Zwwo4NUX4oFJZEHLbXH5ApeO4YmlhxYQknCRvCo04DEVlxkKgpotLu8JAllx8zJYQJD_9W7m5O0m_7zO6-fujkGv5wh3brFoNmgiwCyrkBrazymctOedwVvYl_Y81DrxO_rhcG6uM_JnSI37HRw4XjUlwv3308_K7q79g/360fx360f" class="w-36 h-36 object-contain drop-shadow-xl">
                <div>
                    <h3 class="cyber-font text-3xl text-gray-200">Бомженятко</h3>
                    <p class="text-xs text-textGray mt-1">Дешевий старт для новачків.</p>
                </div>
                <button onclick="openCase('bomzh')" class="cyber-btn w-full py-3 rounded-xl cyber-font text-2xl uppercase">Відкрити (10 ТК)</button>
            </div>
            <!-- Injir (Spy meme) -->
            <div class="cyber-panel p-5 rounded-2xl text-center flex flex-col justify-between items-center h-[430px] border-amber
